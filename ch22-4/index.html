<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울시 공공도서관 검색 Mashup</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .centered-div {
            display: flex;
            justify-content: center;
        }

        .custom-bg-even {
            background-color: #F7BE81;
        }

        .custom-bg-odd {
            background-color: #FAFAD2;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="row mt-2">
            <nav class="navbar navbar-expand-sm bg-light navbar-light centered-div">
                <h3>서울시 공공도서관 정보조회 서비스</h3>
            </nav>
        </div>

        <p class="text-end">2021810071_최진영</p>

        <select id="gu" class="form-select">
            <option value="강남구">강남구</option>
            <option value="강동구">강동구</option>
            <option value="강북구">강북구</option>
            <option value="강서구">강서구</option>
            <option value="관악구">관악구</option>
            <option value="광진구">광진구</option>
            <option value="구로구">구로구</option>
            <option value="금천구">금천구</option>
            <option value="노원구">노원구</option>
            <option value="도봉구">도봉구</option>
            <option value="동대문구">동대문구</option>
            <option value="동작구">동작구</option>
            <option value="마포구">마포구</option>
            <option value="서대문구">서대문구</option>
            <option value="서초구">서초구</option>
            <option value="성동구">성동구</option>
            <option value="성북구">성북구</option>
            <option value="송파구">송파구</option>
            <option value="양천구">양천구</option>
            <option value="영등포구">영등포구</option>
            <option value="용산구">용산구</option>
            <option value="은평구">은평구</option>
            <option value="종로구">종로구</option>
            <option value="중구">중구</option>
            <option value="중랑구">중랑구</option>
        </select>

        <div class="text-center mt-2">
            <input
                class="btn btn-primary"
                onclick="find()"
                type="button"
                id="what"
                value="검색">
        </div>

        <div class="container">
            <div class="row mt-2">

                <div class="col-lg-6 mt-2">
                    <div id="map" style="height:400px;"></div>
                </div>

                <div class="col-lg-6 mt-2">
                    <div id="libraries"></div>
                </div>

            </div>
        </div>

        <div class="centered-div">
            <img id="toTop"
                class="mt-3 mb-3"
                src="images/up-arrow-icon.png"
                onclick="go_top()"
                style="width:50px; cursor:pointer;"
                alt="맨 위로">
        </div>

    </div>

    <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=1b537f6f5a4291ff962aa78a46fc04dd"></script>
    <script src="script.js"></script>
</body>
</html>
